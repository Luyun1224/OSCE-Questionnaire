<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>奇美醫院臨床技能中心 OSCE 回饋分析儀表板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --navy:#0B1A3A;
  --blue:#1B4F9C;
  --blue-soft:#4A7FC1;
  --orange:#F39220;
  --yellow:#F0B429;
  --red:#C0392B;
  --ink:#101018;
  --sidebar:#13131C;
  --paper:#F3F1EA;
  --line:#101018;
  --grey:#B8B2A4;
  --muted:#6B6B78;
  --ok:#2E7D5B;
  --shadow:6px 6px 0 var(--line);
  --shadow-sm:4px 4px 0 var(--line);
  --sb-w:262px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Noto Sans TC","Archivo",system-ui,sans-serif;
  background:var(--paper);color:var(--ink);
  font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.en{font-family:"Archivo","Noto Sans TC",sans-serif;letter-spacing:.04em}
button,select,input{font-family:inherit;font-size:inherit}
a{color:inherit}

/* ---------- Top bar ---------- */
.topbar{
  position:fixed;top:0;left:0;right:0;height:76px;z-index:60;
  background:var(--blue);border-bottom:4px solid var(--line);
  display:flex;align-items:center;gap:16px;padding:0 20px;
}
.brandmark{
  width:52px;height:52px;background:#fff;border:3px solid var(--line);
  box-shadow:4px 4px 0 rgba(0,0,0,.45);
  display:grid;place-items:center;flex:none;
}
.brandmark span{font-weight:900;font-size:11px;color:var(--blue);line-height:1.05;text-align:center}
.brandtext h1{margin:0;font-size:21px;font-weight:900;color:#fff;letter-spacing:.06em}
.brandtext p{margin:0;font-size:11px;font-weight:700;color:#CFE0F5}
.status{
  margin-left:auto;display:flex;align-items:center;gap:8px;
  background:var(--navy);color:#fff;border:3px solid var(--line);
  border-radius:999px;padding:6px 16px;font-size:12px;font-weight:700;
}
.dot{width:9px;height:9px;border-radius:50%;background:#37D67A;box-shadow:0 0 0 3px rgba(55,214,122,.25)}
.dot.offline{background:var(--yellow);box-shadow:0 0 0 3px rgba(240,180,41,.25)}
.dot.error{background:var(--red);box-shadow:0 0 0 3px rgba(192,57,43,.25)}
.menu-toggle{display:none;background:var(--navy);color:#fff;border:3px solid var(--line);padding:8px 12px;font-weight:900;cursor:pointer}

/* ---------- Sidebar ---------- */
.sidebar{
  position:fixed;top:76px;bottom:0;left:0;width:var(--sb-w);z-index:50;
  background:var(--sidebar);border-right:4px solid var(--line);
  overflow-y:auto;padding-bottom:70px;
}
.sb-group{padding:18px 18px 4px}
.sb-title{
  font-size:11px;font-weight:800;color:#fff;letter-spacing:.12em;
  border-left:4px solid var(--yellow);padding-left:8px;margin-bottom:12px;
}
.sb-title.red{border-color:var(--red)}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;color:#9AA3B5;font-weight:700;margin-bottom:5px}
.field select{
  width:100%;padding:9px 10px;background:#fff;border:3px solid var(--line);
  font-weight:700;font-size:13px;cursor:pointer;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);
  background-position:calc(100% - 16px) 18px,calc(100% - 11px) 18px;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;
}
.nav{padding:4px 12px 0}
.nav button{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:transparent;border:3px solid transparent;color:#D5D9E3;
  padding:11px 12px;font-weight:700;font-size:14px;cursor:pointer;margin-bottom:4px;
}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.active{background:var(--yellow);color:var(--ink);border-color:var(--line);box-shadow:4px 4px 0 rgba(0,0,0,.6)}
.nav .ico{font-size:15px;width:18px;text-align:center}
.linklist{padding:0 12px}
.linklist a{
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:11px 12px;color:#D5D9E3;text-decoration:none;font-weight:700;font-size:14px;
  border-bottom:1px solid rgba(255,255,255,.1);
}
.linklist a:hover{color:var(--yellow)}
.sb-foot{
  position:absolute;bottom:0;left:0;right:0;background:var(--sidebar);
  border-top:1px solid rgba(255,255,255,.12);padding:10px;
  text-align:center;font-size:10px;color:#6E7686;line-height:1.5;
}

/* ---------- Main ---------- */
.main{margin-left:var(--sb-w);padding:100px 28px 60px;max-width:1520px}
.pagehead{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.pagehead .bar{width:14px;height:34px;background:var(--red);border:3px solid var(--line);flex:none;margin-top:4px}
.pagehead h2{margin:0;font-size:30px;font-weight:900;letter-spacing:.02em}
.pagehead p{margin:2px 0 0;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.08em}
.pagehead .actions{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
.btn{
  background:var(--navy);color:#fff;border:3px solid var(--line);box-shadow:var(--shadow-sm);
  padding:10px 16px;font-weight:800;font-size:13px;cursor:pointer;
}
.btn:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--line)}
.btn:active{transform:translate(4px,4px);box-shadow:none}
.btn.y{background:var(--yellow);color:var(--ink)}
.btn.r{background:var(--red)}
.btn.w{background:#fff;color:var(--ink)}
.btn.sm{padding:6px 11px;font-size:12px;box-shadow:3px 3px 0 var(--line)}

.card{background:#fff;border:3px solid var(--line);box-shadow:var(--shadow);padding:20px;margin-bottom:24px}
.card > h3{
  margin:0 0 4px;font-size:18px;font-weight:900;display:flex;align-items:center;gap:9px;flex-wrap:wrap;
}
.card > h3::before{content:"";width:9px;height:20px;background:var(--blue);flex:none}
.card .sub{margin:0 0 16px;font-size:12px;color:var(--muted);font-weight:600}
.grid{display:grid;gap:22px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}

/* KPI */
.kpi{background:#fff;border:3px solid var(--line);box-shadow:var(--shadow-sm);padding:16px 18px;position:relative;overflow:hidden}
.kpi .tag{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.06em}
.kpi .val{font-family:"Archivo",sans-serif;font-size:38px;font-weight:800;line-height:1.1;margin:4px 0 0}
.kpi .unit{font-size:14px;font-weight:700;color:var(--muted);margin-left:4px}
.kpi .note{font-size:11px;color:var(--muted);font-weight:600;margin-top:4px}
.kpi::after{content:"";position:absolute;right:-18px;top:-18px;width:56px;height:56px;background:var(--yellow);transform:rotate(45deg)}
.kpi.b::after{background:var(--blue)}
.kpi.r::after{background:var(--red)}
.kpi.n::after{background:var(--navy)}

/* question table */
.qrow{border:3px solid var(--line);margin-bottom:12px;background:#fff}
.qrow .top{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-bottom:2px dashed #D8D4C8}
.qrow .qno{
  font-family:"Archivo",sans-serif;font-weight:800;font-size:13px;background:var(--navy);color:#fff;
  padding:3px 9px;flex:none;border:2px solid var(--line)
}
.qrow .qtext{font-weight:700;font-size:15px;flex:1;min-width:200px}
.qrow .qtext em{font-style:normal;font-size:11px;font-weight:700;color:var(--red);margin-left:6px}
.qrow .qstat{display:flex;gap:18px;align-items:center;flex:none}
.qrow .num{font-family:"Archivo",sans-serif;font-weight:800;font-size:24px;line-height:1}
.qrow .num small{font-size:11px;color:var(--muted);display:block;font-family:"Noto Sans TC",sans-serif;font-weight:700}
.badge{font-size:11px;font-weight:800;padding:4px 9px;border:2px solid var(--line);white-space:nowrap}
.badge.a{background:var(--navy);color:#fff}
.badge.b{background:var(--blue-soft);color:#fff}
.badge.c{background:var(--yellow)}
.badge.d{background:var(--red);color:#fff}
.dist{display:flex;height:26px;border-top:0}
.dist span{display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;overflow:hidden;white-space:nowrap}
.dist span:not(:last-child){border-right:2px solid rgba(255,255,255,.55)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;font-weight:700;color:var(--muted);margin:2px 0 14px}
.legend i{display:inline-block;width:12px;height:12px;border:2px solid var(--line);margin-right:5px;vertical-align:-2px}

/* comments */
.cmt{border-left:6px solid var(--yellow);background:#FBF9F3;border:2px solid var(--line);border-left-width:6px;padding:11px 13px;margin-bottom:10px}
.cmt .meta{font-size:11px;font-weight:800;color:var(--muted);margin-bottom:4px;display:flex;gap:10px;flex-wrap:wrap}
.cmt .meta b{color:var(--blue)}
.cmt p{margin:0;font-size:14px;white-space:pre-wrap;word-break:break-word}
.cmt.alt{border-left-color:var(--blue)}
.search{width:100%;padding:9px 12px;border:3px solid var(--line);font-weight:600;margin-bottom:14px}
.person-filter{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:#EFF5FB;border:3px solid var(--line);padding:14px 16px;margin-bottom:18px}
.person-filter label{font-weight:900}
.person-filter select{min-width:220px;padding:9px 38px 9px 11px;background:#fff;border:3px solid var(--line);font-weight:800}
.person-filter .hint{font-size:12px;color:var(--muted);font-weight:700}
.gap-pos{color:var(--ok);font-weight:900}.gap-neg{color:var(--red);font-weight:900}.gap-zero{color:var(--muted);font-weight:900}

/* insights */
.ins{display:flex;gap:11px;align-items:flex-start;border:3px solid var(--line);padding:12px 14px;margin-bottom:10px;background:#fff}
.ins .lv{font-size:11px;font-weight:800;padding:4px 8px;border:2px solid var(--line);flex:none;white-space:nowrap}
.ins.high{background:#FDF0EE}.ins.high .lv{background:var(--red);color:#fff}
.ins.mid{background:#FEF8E8}.ins.mid .lv{background:var(--yellow)}
.ins.good{background:#EFF5FB}.ins.good .lv{background:var(--blue);color:#fff}
.ins p{margin:0;font-size:14px}
.ins p b{color:var(--ink)}

.chartbox{position:relative;height:340px}
.chartbox.tall{height:400px}
.chartbox.short{height:260px}

table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th,table.tbl td{border:2px solid var(--line);padding:8px 10px;text-align:center}
table.tbl th{background:var(--navy);color:#fff;font-weight:800;font-size:12px}
table.tbl td.l{text-align:left}
table.tbl tbody tr:nth-child(even){background:#FAF8F2}

.entrygrid{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.entry{
  border:3px solid var(--line);box-shadow:var(--shadow);padding:16px 22px;cursor:pointer;
  font-weight:900;font-size:15px;color:#fff;background:var(--blue);min-width:190px;text-align:center;
}
.entry small{display:block;font-weight:700;font-size:11px;opacity:.85;margin-top:3px}
.entry:hover{transform:translate(2px,2px);box-shadow:3px 3px 0 var(--line)}
.entry.r{background:var(--red)}
.entry.y{background:var(--yellow);color:var(--ink)}
.entry.n{background:var(--navy)}

.notice{border:3px solid var(--line);background:var(--yellow);padding:12px 16px;font-weight:700;font-size:13px;margin-bottom:22px;box-shadow:var(--shadow-sm)}
.notice.err{background:#FDE2DE}
.empty{padding:34px;text-align:center;color:var(--muted);font-weight:700;border:3px dashed var(--grey)}
.hidden{display:none !important}
.loader{position:fixed;inset:0;background:rgba(243,241,234,.94);z-index:90;display:grid;place-items:center}
.loader .box{background:#fff;border:3px solid var(--line);box-shadow:var(--shadow);padding:26px 40px;text-align:center;font-weight:800}
.spin{width:38px;height:38px;border:5px solid var(--navy);border-top-color:var(--yellow);border-radius:50%;margin:0 auto 12px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}.btn:hover,.entry:hover{transform:none}}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}

@media (max-width:1180px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:980px){
  .sidebar{transform:translateX(-100%);transition:transform .2s}
  .sidebar.open{transform:none}
  .main{margin-left:0;padding:96px 16px 50px}
  .menu-toggle{display:block}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .qrow .qstat{width:100%;justify-content:space-between}
}
@media print{
  .sidebar,.topbar,.actions,.menu-toggle{display:none !important}
  .main{margin:0;padding:0}
  .card{break-inside:avoid;box-shadow:none}
}
</style>
</head>
<body>

<header class="topbar">
  <button class="menu-toggle" id="menuToggle" aria-label="開關側邊選單">☰</button>
  <div class="brandmark"><span>CM<br>Hospital</span></div>
  <div class="brandtext">
    <h1>臨床技能中心</h1>
    <p class="en">OSCE FEEDBACK DASHBOARD</p>
  </div>
  <div class="status" id="statusPill"><span class="dot" id="statusDot"></span><span id="statusText">連線中…</span></div>
</header>

<aside class="sidebar" id="sidebar">
  <div class="sb-group">
    <div class="sb-title en">▽ 篩選條件 FILTERS</div>
    <div class="field">
      <label for="fYear">年度 Year</label>
      <select id="fYear"><option value="ALL">全部年度 All</option></select>
    </div>
    <div class="field">
      <label for="fSession">場次 Session</label>
      <select id="fSession"><option value="ALL">全部場次 All Sessions</option></select>
    </div>
    <div class="field">
      <label for="fStation">站次 Station</label>
      <select id="fStation"><option value="ALL">全部站次 All Stations</option></select>
    </div>
  </div>

  <div class="sb-group" style="padding-bottom:0">
    <div class="sb-title en">儀表板 DASHBOARD</div>
  </div>
  <nav class="nav" id="nav">
    <button data-view="overview" class="active"><span class="ico">▤</span>綜合分析總覽</button>
    <button data-view="examinerSP"><span class="ico">☑</span>考官評核 SP 分析</button>
    <button data-view="examiner"><span class="ico">▥</span>考官回饋分析</button>
    <button data-view="student"><span class="ico">✎</span>考生回饋分析</button>
    <button data-view="sp"><span class="ico">☺</span>標準化病人回饋分析</button>
  </nav>

  <div class="sb-group" style="padding-bottom:0">
    <div class="sb-title red en">問卷填寫 SURVEY ENTRY</div>
  </div>
  <div class="linklist" id="linklist"></div>

  <div class="sb-foot">v1.0 · 臨床技能中心<br><span id="dataStamp">—</span></div>
</aside>

<main class="main" id="main"></main>

<div class="loader" id="loader">
  <div class="box"><div class="spin"></div>讀取 Google 試算表資料中…</div>
</div>

<script>
/* =========================================================
   1. 設定區（部署後只需要改這裡）
   ========================================================= */
const CONFIG = {
  // 貼上 Apps Script 網頁應用程式的 /exec 網址
  API_URL: '',
  // 若 Code.gs 有設 TOKEN，這裡填相同字串
  TOKEN: '',
  // 側邊「問卷填寫」連結（換成你的 Google 表單網址）
  FORMS: [
    { name: '考官評核 SP',   url: '' },
    { name: '考官回饋問卷',  url: '' },
    { name: '考生回饋問卷',  url: '' },
    { name: 'SP 回饋問卷',   url: '' }
  ]
};

/* =========================================================
   2. 問卷題目定義（題目全文取自學會版紙本問卷）
   ========================================================= */
const LIKERT      = ['非常不同意','不同意','無意見','同意','非常同意'];
const LIKERT_SP   = ['完全不同意','不同意','無意見(中立)','同意','完全同意'];
const DIFFICULTY  = ['非常簡單','簡單','剛好','困難','非常困難'];

const SCHEMA = {
  examinerSP: {
    title:'考官評核 SP 分析', en:'EXAMINER RATING OF STANDARDIZED PATIENTS',
    formName:'考官對標準化病人(SP)演出評核表', accent:'blue', scale:LIKERT_SP,
    meta:[{col:'考試日期',label:'考試日期'},{col:'考官姓名',label:'考官'},{col:'標準化病人',label:'SP'}],
    person:'考官姓名',
    items:[
      {col:'Q1',short:'演出一致性',text:'SP 演出可靠，演出一致性佳。'},
      {col:'Q2',short:'刻意操弄訊息',text:'SP 刻意操弄訊息。',reverse:true},
      {col:'Q3',short:'過度質疑考生',text:'SP 過度質疑或挑戰學生的問診。',reverse:true},
      {col:'Q4',short:'症狀擬真',text:'SP 模擬的身體症狀、心情夠真實。'},
      {col:'Q5',short:'表情符合角色',text:'SP 的表情能符合角色的要求。'},
      {col:'Q6',short:'肢體語言',text:'SP 的肢體語言能符合角色的要求。'},
      {col:'Q7',short:'自然應答',text:'SP 能夠自然的回答問診的問題。'},
      {col:'Q8',short:'不逾越劇情',text:'SP 沒有與考生進行考題劇情以外的對話。'}
    ],
    texts:[{col:'總評語',title:'考官總評語'}]
  },
  examiner: {
    title:'考官回饋分析', en:'EXAMINER FEEDBACK',
    formName:'考官回饋問卷', accent:'red', scale:LIKERT,
    meta:[{col:'考試日期',label:'考試日期'},{col:'考官姓名',label:'考官'},{col:'站次',label:'站次'}],
    person:'考官姓名',
    items:[
      {col:'Q1',short:'內容與難度',text:'測驗內容及其難度合宜。'},
      {col:'Q2',short:'評分項目',text:'評核表評分項目合宜。'},
      {col:'Q3',short:'評分說明',text:'評分說明內容清楚、合宜。'},
      {col:'Q4',short:'試題指引',text:'試題指引內容足夠。'},
      {col:'Q5',short:'測驗時間',text:'測驗時間 (8 mins) 長短合宜。'},
      {col:'Q6',short:'標示與動線',text:'試場各項標示、移動路線規劃清楚、合宜。'},
      {col:'Q7',short:'鈴聲與廣播',text:'試場各項鈴聲、廣播清楚、合宜。'},
      {col:'Q8',short:'試務運作',text:'試務運作流程順暢、試務人員紀律良好。'}
    ],
    texts:[
      {col:'Q9',title:'對於本考題之建議'},
      {col:'Q10',title:'對於 OSCE 整體活動之其他意見及建議'}
    ]
  },
  student: {
    title:'考生回饋分析', en:'EXAMINEE FEEDBACK',
    formName:'考生回饋問卷', accent:'yellow', scale:LIKERT,
    meta:[{col:'考試日期',label:'考試日期'}],
    items:[
      {col:'Q1',short:'貼近平日所學',text:'考試內容來自於平日所學內容。'},
      {col:'Q2',short:'標示與動線',text:'試場各項標示與移動路線規劃清楚、合宜。'},
      {col:'Q3',short:'試題指引',text:'試題指引內容清楚、訊息足夠。'},
      {col:'Q4',short:'SP 站時間',text:'標準化病人測驗站考試時間 (8 mins) 長短合宜。'},
      {col:'Q5',short:'SP 站難度',text:'標準化病人測驗站考試難度合宜。'},
      {col:'Q6',short:'SP 擬真度',text:'各站標準化病人的演出皆像是真實病人。'},
      {col:'Q7',short:'技能站時間',text:'技能測驗站考試時間 (8 mins) 長短合宜。'},
      {col:'Q8',short:'技能站難度',text:'技能測驗站考試難度合宜。'},

function jsonp(url, timeout){
  return new Promise((resolve,reject)=>{
    const cb = 'osceCB_' + Math.random().toString(36).slice(2);
    const s = document.createElement('script');
    const t = setTimeout(()=>{ cleanup(); reject(new Error('連線逾時')); }, timeout||20000);
    function cleanup(){ clearTimeout(t); delete window[cb]; if(s.parentNode) s.parentNode.removeChild(s); }
    window[cb] = d => { cleanup(); resolve(d); };
    s.onerror = () => { cleanup(); reject(new Error('無法連線至 Apps Script')); };
    s.src = url + (url.indexOf('?')<0?'?':'&') + 'callback=' + cb;
    document.body.appendChild(s);
  });
}

async function loadData(force){
  setStatus('loading','讀取中…');
  if(!CONFIG.API_URL){
    STATE.raw = DEMO_DATA; STATE.source = 'demo';
    setStatus('offline','離線示範資料');
    $('#dataStamp').textContent = '示範資料（未設定 API）';
    return;
  }
  try{
    const url = CONFIG.API_URL + '?action=all'
      + (CONFIG.TOKEN ? '&token='+encodeURIComponent(CONFIG.TOKEN) : '')
      + (force ? '&nocache=1' : '');
    const res = await jsonp(url);
    if(!res || !res.ok) throw new Error((res && res.error) || '回傳格式錯誤');
    STATE.raw = res.data; STATE.source = 'live';
    setStatus('ok','資料連線正常');
    $('#dataStamp').textContent = '更新於 ' + (res.generatedAt||'');
  }catch(err){
    STATE.raw = DEMO_DATA; STATE.source = 'demo';
    setStatus('error','連線失敗，改用示範資料');
    $('#dataStamp').textContent = '讀取失敗：' + err.message;
  }
}

function toRecords(key){
  const blk = STATE.raw && STATE.raw[key];
  if(!blk || !blk.headers) return [];
  return blk.rows.map(r=>{
    const o = {};
    blk.headers.forEach((h,i)=> o[h] = r[i]===undefined?'':r[i]);
    o.__date = normDate(o['考試日期']);
    o.__year = o.__date ? o.__date.split('.')[0] : '';
    return o;
  }).filter(o=>o.__date);
}

function normDate(v){
  const s = String(v==null?'':v).trim();
  const m = s.match(/^(\d{3})[.\-\/](\d{1,2})[.\-\/](\d{1,2})$/);
  if(!m) return '';
  return m[1] + '.' + String(m[2]).padStart(2,'0') + '.' + String(m[3]).padStart(2,'0');
}
function fmtDate(d){ return d ? d.replace(/\./g,'/') : '—'; }

function filtered(key){
  const f = STATE.filters;
  return toRecords(key).filter(r=>{
    if(f.year!=='ALL' && r.__year!==f.year) return false;
    if(f.session!=='ALL' && r.__date!==f.session) return false;
    if(f.station!=='ALL'){
      if(!('站次' in r)) return true;
      if(String(r['站次'])!==String(f.station)) return false;
    }
    return true;
  });
}

const num = v => { const n = Number(v); return (v===''||v===null||v===undefined||isNaN(n)) ? null : n; };
const avg = a => a.length ? a.reduce((s,x)=>s+x,0)/a.length : null;
const r1  = v => v==null ? '—' : (Math.round(v*10)/10).toFixed(1);
const r2  = v => v==null ? '—' : (Math.round(v*100)/100).toFixed(2);
const pct = v => v==null ? '—' : Math.round(v*100) + '%';

/** 單題統計 */
function itemStat(rows,item){
  const vals = rows.map(r=>num(r[item.col])).filter(v=>v!==null && v>=1 && v<=5);
  const dist = [0,0,0,0,0];
  vals.forEach(v=>{ dist[Math.round(v)-1]++; });
  const m = avg(vals);
  const positive = item.reverse ? (dist[0]+dist[1]) : (dist[3]+dist[4]);
  const negative = item.reverse ? (dist[3]+dist[4]) : (dist[0]+dist[1]);
  return {
    col:item.col, short:item.short, text:item.text, reverse:!!item.reverse,
    n:vals.length, mean:m, adj: m==null?null:(item.reverse?6-m:m),
    dist, agree: vals.length? positive/vals.length : null,
    disagree: vals.length? negative/vals.length : null
  };
}

/** 整份問卷統計 */
function sheetStat(key,rows){
  const sc = SCHEMA[key];
  const stats = sc.items.map(it=>itemStat(rows,it));
  const valid = stats.filter(s=>s.adj!=null);
  const comments = collectComments(key,rows);
  return {
    key, rows, stats,
    composite: valid.length ? avg(valid.map(s=>s.adj)) : null,
    agree: valid.length ? avg(stats.filter(s=>s.agree!=null).map(s=>s.agree)) : null,
    n: rows.length, comments
  };
}

function collectComments(key,rows){
  const sc = SCHEMA[key]; const out = [];
  (sc.texts||[]).forEach(t=>{
    rows.forEach(r=>{
      const v = String(r[t.col]==null?'':r[t.col]).trim();
      if(v && v.length>1 && !/^[-—.。0]+$/.test(v)){
        out.push({ date:r.__date, title:t.title, text:v,
          who: sc.person ? String(r[sc.person]||'') : '',
          station: r['站次']!==undefined && r['站次']!=='' ? String(r['站次']) : '' });
      }
    });
  });
  return out.sort((a,b)=> a.date<b.date?1:a.date>b.date?-1:0);
}

function levelOf(adj){
  if(adj==null) return {cls:'b',label:'無資料'};
  if(adj>=4.5) return {cls:'a',label:'優良'};
  if(adj>=4.0) return {cls:'b',label:'良好'};
  if(adj>=3.5) return {cls:'c',label:'待觀察'};
  return {cls:'d',label:'需改善'};
}

/* =========================================================
   8. 分析建議（規則式）
   ========================================================= */
function buildInsights(key,S){
  const out = [];
  const sc = SCHEMA[key];
  if(!S.n){ return [{level:'mid',tag:'無資料',html:'此篩選條件下沒有任何填答紀錄，請放寬年度或場次條件。'}]; }

  S.stats.filter(s=>s.adj!=null).sort((a,b)=>a.adj-b.adj).forEach(s=>{
    if(s.adj<3.5){
      out.push({level:'high',tag:'優先改善',
        html:`<b>${esc(s.col)} ${esc(s.short)}</b>（${esc(s.text)}）平均 ${r2(s.mean)} 分，已低於 3.5 的警戒線，建議列入下一次考務檢討的第一順位。`});
    }else if(s.adj<4.0){
      out.push({level:'mid',tag:'建議關注',
        html:`<b>${esc(s.col)} ${esc(s.short)}</b> 平均 ${r2(s.mean)} 分，${s.reverse?'正向':'同意'}率 ${pct(s.agree)}，尚有改善空間。`});
    }
  });

  S.stats.forEach(s=>{
    if(s.n>=10 && s.disagree!=null && s.disagree>=0.10 && s.adj!=null && s.adj>=4.0){
      out.push({level:'mid',tag:'意見分歧',
        html:`<b>${esc(s.col)} ${esc(s.short)}</b> 整體平均尚可，但有 ${pct(s.disagree)}（${s.reverse?s.dist[3]+s.dist[4]:s.dist[0]+s.dist[1]} 人）給出負向評價，建議看看同場次的文字建議。`});
    }
  });

  if(key==='student'){
    const d = difficultyStat(S.rows);
    if(d.n){
      const hard = (d.dist[3]+d.dist[4])/d.n, easy = (d.dist[0]+d.dist[1])/d.n;
      if(hard>=0.30) out.push({level:'high',tag:'難度偏高',html:`有 ${pct(hard)} 的考生認為測驗<b>偏難或非常難</b>，建議檢視站別配置與試題指引的訊息量。`});
      else if(easy>=0.30) out.push({level:'mid',tag:'難度偏低',html:`有 ${pct(easy)} 的考生認為測驗<b>偏簡單</b>，可考慮提高鑑別度。`});
      else out.push({level:'good',tag:'難度合宜',html:`${pct(d.dist[2]/d.n)} 的考生認為難度「剛好」，整體難度設定落在理想區間。`});
    }
    const sps = S.stats.filter(s=>['Q4','Q5','Q6'].indexOf(s.col)>=0 && s.adj!=null);
    const sks = S.stats.filter(s=>['Q7','Q8'].indexOf(s.col)>=0 && s.adj!=null);
    if(sps.length && sks.length){
      const a = avg(sps.map(s=>s.adj)), b = avg(sks.map(s=>s.adj));
      if(Math.abs(a-b)>=0.25){
        out.push({level:'mid',tag:'站別落差',
          html:`SP 測驗站平均 ${r2(a)} 分、技能測驗站平均 ${r2(b)} 分，兩類站別的考生感受相差 ${r2(Math.abs(a-b))} 分，建議針對<b>${a<b?'SP 測驗站':'技能測驗站'}</b>檢討時間與難度設定。`});
      }
    }
  }

  if(key==='sp'){
    const act = S.rows.map(r=>num(r['Q4.1'])).filter(v=>v!==null);
    const sug = S.rows.map(r=>num(r['Q4.2'])).filter(v=>v!==null);
    if(act.length){
      out.push({level: sug.length && avg(act)>avg(sug) ? 'mid':'good', tag:'演出負荷',
        html:`SP 平均每人每場演出 <b>${r1(avg(act))} 次</b>（最多 ${Math.max.apply(null,act)} 次）${sug.length?`；有 ${sug.length} 位 SP 填寫建議次數，平均為 ${r1(avg(sug))} 次`:''}。`});
    }
    if(sug.length>=3 && sug.length/Math.max(S.n,1) >= 0.25){
      out.push({level:'high',tag:'體力負擔',
        html:`有 <b>${sug.length} 位（${pct(sug.length/S.n)}）</b>SP 填寫了「適宜演出次數」，代表他們認為當天演出次數<b>超過體力負擔</b>，建議調整梯次或增聘 SP。`});
    }
  }

  if(key==='examinerSP'){
    const rev = S.stats.filter(s=>s.reverse && s.mean!=null);
    if(rev.length){
      out.push({level:'good',tag:'反向題',
        html:`Q2、Q3 為反向題（分數越低越好），目前平均為 ${rev.map(s=>esc(s.col)+' '+r2(s.mean)).join('、')} 分，代表 SP 大致沒有操弄訊息或過度挑戰考生。`});
    }
  }

  if(key==='examiner'){
    const byStation = groupMean(S.rows,'站次',sc.items);
    const low = byStation.filter(g=>g.mean!=null).sort((a,b)=>a.mean-b.mean)[0];
    if(low && byStation.length>2 && low.mean<4.2){
      out.push({level:'mid',tag:'站別差異',
        html:`第 <b>${esc(low.key)}</b> 站的考官整體評價最低（${r2(low.mean)} 分，${low.n} 份），建議優先檢視該站的評核表與試題指引。`});
    }
  }

  dataQuality(key,S).forEach(x=>out.push(x));

  if(!out.length) out.push({level:'good',tag:'表現良好',html:'所有題項平均皆在 4.0 分以上，未偵測到需要立即處理的項目。'});
  return out.slice(0,10);
}

/** 登錄方向檢查：同一題在某場次的平均與整體方向相反，多半是量表反向登錄 */
function dataQuality(key,S){
  const out = [];
  S.stats.forEach(st=>{
    if(st.adj==null || st.adj<4) return;
    const item = SCHEMA[key].items.find(i=>i.col===st.col);
    const bySess = new Map();
    S.rows.forEach(r=>{ const v=num(r[st.col]); if(v===null) return;
      if(!bySess.has(r.__date)) bySess.set(r.__date,[]); bySess.get(r.__date).push(v); });
    const odd = Array.from(bySess.entries())
      .map(([d,v])=>({d,m:avg(v),n:v.length}))
      .filter(x=> x.n>=3 && (item.reverse ? x.m>=4 : x.m<=2));
    if(odd.length){
      out.push({level:'mid',tag:'資料品質',
        html:`<b>${esc(st.col)} ${esc(st.short)}</b> 在 ${odd.map(x=>fmtDate(x.d)).join('、')} 的平均為 ${odd.map(x=>r2(x.m)).join('、')} 分，與其他場次方向相反，建議確認該場次是否<b>把量表方向登錄反了</b>，以免拉低整題平均。`});
    }
  });
  return out.slice(0,2);
}

function difficultyStat(rows){
  const vals = rows.map(r=>num(r['Q10'])).filter(v=>v!==null&&v>=1&&v<=5);
  const dist=[0,0,0,0,0]; vals.forEach(v=>dist[Math.round(v)-1]++);
  return {n:vals.length,dist,mean:avg(vals)};
}

function groupMean(rows,field,items){
  const map = new Map();
  rows.forEach(r=>{
    const k = String(r[field]==null?'':r[field]).trim(); if(!k) return;
    if(!map.has(k)) map.set(k,[]);
    const v = items.map(it=>{ const x=num(r[it.col]); return x==null?null:(it.reverse?6-x:x); }).filter(x=>x!==null);
    if(v.length) map.get(k).push(avg(v));
  });
  return Array.from(map.entries()).map(([k,v])=>({key:k,mean:avg(v),n:v.length}))
    .sort((a,b)=> isNaN(+a.key)||isNaN(+b.key) ? a.key.localeCompare(b.key) : (+a.key)-(+b.key));
}

function sessionSeries(key,rows){
  const sc = SCHEMA[key]; const map = new Map();
  rows.forEach(r=>{
    const v = sc.items.map(it=>{ const x=num(r[it.col]); return x==null?null:(it.reverse?6-x:x); }).filter(x=>x!==null);
    if(!v.length) return;
    if(!map.has(r.__date)) map.set(r.__date,[]);
    map.get(r.__date).push(avg(v));
  });
  return Array.from(map.entries()).map(([d,v])=>({date:d,mean:avg(v),n:v.length}))
    .sort((a,b)=> a.date<b.date?-1:1);
}

function extrasCharts(key,S,color){
  if(!S.n) return;
  const sc = SCHEMA[key];
  if(key==='examiner'){
    const g = groupMean(S.rows,'站次',sc.items);
    barChart('exStation', g.map(x=>'第'+x.key+'站'), g.map(x=>Math.round(x.mean*100)/100), color, {min:3,max:5,unit:' 分'});
    stackChart('exStack', S.stats.map(s=>s.col+' '+s.short), S.stats.map(s=>s.dist), sc.scale);
  }
  if(key==='student'){
    const d = difficultyStat(S.rows);
    mk('stDiff',{ type:'bar',
      data:{ labels:DIFFICULTY, datasets:[{ data:d.dist,
        backgroundColor:['#A12B1E','#D9694A','#2E7D5B','#4A7FC1','#12356B'], borderColor:'#101018', borderWidth:2 }]},
      options:{ maintainAspectRatio:false, plugins:{legend:{display:false}},
        scales:{ x:{grid:{display:false}}, y:{grid:{color:'#E4E0D5'}} } }});
    const pick = c => { const s = S.stats.find(x=>x.col===c); return s && s.adj!=null ? Math.round(s.adj*100)/100 : null; };
    mk('stCmp',{ type:'bar',
      data:{ labels:['測驗時間','測驗難度'],
        datasets:[
          { label:'標準化病人站', data:[pick('Q4'),pick('Q5')], backgroundColor:'#1B4F9C', borderColor:'#101018', borderWidth:2 },
          { label:'技能測驗站',   data:[pick('Q7'),pick('Q8')], backgroundColor:'#F0B429', borderColor:'#101018', borderWidth:2 }]},
      options:{ maintainAspectRatio:false, scales:{ y:{min:3,max:5,grid:{color:'#E4E0D5'}}, x:{grid:{display:false}} },
        plugins:{ legend:{position:'bottom',labels:{boxWidth:14,font:{weight:700}}} } }});
  }
  if(key==='sp'){
    const bySess = new Map();
    S.rows.forEach(r=>{ const a=num(r['Q4.1']); if(a===null) return;
      if(!bySess.has(r.__date)) bySess.set(r.__date,[]); bySess.get(r.__date).push(a); });
    const sess = Array.from(bySess.entries()).sort((a,b)=>a[0]<b[0]?-1:1);
    barChart('spCount', sess.map(x=>fmtDate(x[0])), sess.map(x=>Math.round(avg(x[1])*10)/10), color, {min:0,unit:' 次'});
  }
  if(key==='examinerSP'){
    stackChart('spStack', S.stats.map(s=>s.col+(s.reverse?'↓':'')+' '+s.short), S.stats.map(s=>s.dist), sc.scale);
    const named = S.rows.filter(r=>String(r['標準化病人']||'').trim());
    const personalRows = named.filter(r=>String(r['標準化病人']).trim()===STATE.selectedSP);
    if(personalRows.length) comparisonRadarChart('spCompare',sheetStat(key,personalRows).stats,S.stats,STATE.selectedSP);
  }
}

/* =========================================================
   11. 篩選器、導覽與事件
   ========================================================= */
function buildFilters(){
  const dates = new Set();
  const stations = new Set();
  Object.keys(SCHEMA).forEach(k=> toRecords(k).forEach(r=>{
    dates.add(r.__date);
    const st = r['站次']; if(st!=='' && st!==undefined && st!==null) stations.add(String(st));
  }));
  const all = Array.from(dates).sort().reverse();
  const years = Array.from(new Set(all.map(d=>d.split('.')[0]))).sort().reverse();

  const ySel = $('#fYear');
  ySel.innerHTML = '<option value="ALL">全部年度 All</option>' +
    years.map(y=>`<option value="${y}">${y} 年度</option>`).join('');
  if(years.indexOf(STATE.filters.year)<0) STATE.filters.year = 'ALL';
  ySel.value = STATE.filters.year;
  fillSessions();

  const stList = Array.from(stations).sort((a,b)=>(+a)-(+b));
  const stSel = $('#fStation');
  stSel.innerHTML = '<option value="ALL">全部站次 All Stations</option>' +
    stList.map(s=>`<option value="${s}">第 ${s} 站</option>`).join('');
  if(stList.indexOf(STATE.filters.station)<0) STATE.filters.station = 'ALL';
  stSel.value = STATE.filters.station;
}

function fillSessions(){
  const y = STATE.filters.year;
  const dates = new Set();
  Object.keys(SCHEMA).forEach(k=> toRecords(k).forEach(r=>{
    if(y==='ALL' || r.__year===y) dates.add(r.__date);
  }));
  const list = Array.from(dates).sort().reverse();
  $('#fSession').innerHTML = '<option value="ALL">全部場次 All Sessions</option>' +
    list.map(d=>`<option value="${d}">${fmtDate(d)}</option>`).join('');
  if(list.indexOf(STATE.filters.session)<0) STATE.filters.session = 'ALL';
  $('#fSession').value = STATE.filters.session;
}

function buildLinks(){
  const box = $('#linklist');
  const items = CONFIG.FORMS.filter(f=>f.url);
  box.innerHTML = items.length
    ? items.map(f=>`<a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.name)}<span>↗</span></a>`).join('')
    : '<a style="cursor:default;color:#6E7686">尚未設定表單連結<span>—</span></a>';
}

function render(){
  destroyCharts();
  if(STATE.view==='overview') renderOverview();
  else renderSheet(STATE.view);
  window.scrollTo(0,0);
}

function goto(view){
  STATE.view = view;
  $$('#nav button').forEach(b=> b.classList.toggle('active', b.dataset.view===view));
  if(window.innerWidth<=980) $('#sidebar').classList.remove('open');
  render();
}

/* CSV 匯出 */
function download(name,text){
  const blob = new Blob(['\ufeff'+text],{type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
const csvCell = v => '"' + String(v==null?'':v).replace(/"/g,'""') + '"';
const csvRow  = a => a.map(csvCell).join(',');

function exportItems(){
  const {key,S} = window.__export || {}; if(!S) return;
  const sc = SCHEMA[key];
  const lines = [csvRow(['題號','題目','填答數','平均','同意率／正向率'].concat(sc.scale))];
  S.stats.forEach(s=> lines.push(csvRow([s.col, s.text + (s.reverse?'（反向題）':''), s.n, r2(s.mean), pct(s.agree)].concat(s.dist))));
  download(`${sc.formName}_逐題分析_${yearsLabel()}.csv`, lines.join('\n'));
}

function exportComments(){
  const {key,S} = window.__export || {}; if(!S) return;
  const lines = [csvRow(['考試日期','題項','填答者','站次','文字建議'])];
  S.comments.forEach(c=> lines.push(csvRow([fmtDate(c.date), c.title, c.who, c.station, c.text])));
  download(`${SCHEMA[key].formName}_文字建議_${yearsLabel()}.csv`, lines.join('\n'));
}

function bind(){
  $('#nav').addEventListener('click', e=>{
    const b = e.target.closest('button[data-view]'); if(b) goto(b.dataset.view);
  });
  $('#main').addEventListener('click', async e=>{
    const g = e.target.closest('[data-goto]'); if(g){ goto(g.dataset.goto); return; }
    const a = e.target.closest('[data-act]'); if(!a) return;
    if(a.dataset.act==='print') window.print();
    if(a.dataset.act==='csv') exportItems();
    if(a.dataset.act==='csvc') exportComments();
    if(a.dataset.act==='refresh'){
      $('#loader').classList.remove('hidden');
      await loadData(true); buildFilters(); render();
      $('#loader').classList.add('hidden');
    }
  });
  $('#main').addEventListener('input', e=>{
    if(e.target.matches('[data-search]')){
      const q = e.target.value.trim().toLowerCase();
      const box = $(`[data-cmtlist="${e.target.dataset.search}"]`); if(!box) return;
      $$('.cmt',box).forEach(c=> c.classList.toggle('hidden',
        q && c.dataset.text.toLowerCase().indexOf(q)<0));
    }
  });
  $('#main').addEventListener('change', e=>{
    if(e.target.matches('#spPersonSelect')){
      STATE.selectedSP = e.target.value;
      render();
    }
  });
  $('#fYear').addEventListener('change', e=>{
    STATE.filters.year = e.target.value; fillSessions(); render();
  });
  $('#fSession').addEventListener('change', e=>{ STATE.filters.session = e.target.value; render(); });
  $('#fStation').addEventListener('change', e=>{ STATE.filters.station = e.target.value; render(); });
  $('#menuToggle').addEventListener('click', ()=> $('#sidebar').classList.toggle('open'));
}
